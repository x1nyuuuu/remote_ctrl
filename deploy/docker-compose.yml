# Local pathfinding stack. VPS/domain come later — change .env when ready.
# Note: Docker Desktop (Windows) cannot use network_mode:host; ports are published instead.
services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      LISTEN_ADDR: ":8080"
      # Inside compose, browsers on the host still need TURN_HOST=127.0.0.1
      # (published ports). Agent on host uses the same.
      TURN_HOST: ${TURN_HOST:-127.0.0.1}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_SECRET: ${TURN_SECRET:-dev-turn-secret-change-me}
      AUTH_TOKEN: ${AUTH_TOKEN:-dev-token-change-me}
      PUBLIC_STUN_URL: ${PUBLIC_STUN_URL:-stun:stun.l.google.com:19302}
    depends_on:
      - coturn
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.6.2
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49152-49200:49152-49200/udp"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    restart: unless-stopped
