# nginx — Cloudflare Origin 证书 + WebSocket 反代
# 安装: sudo cp nginx.conf /etc/nginx/sites-available/remote-control
#       sudo ln -sf /etc/nginx/sites-available/remote-control /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# 修改 RC_DOMAIN 为你的子域名

upstream remote_control_backend {
    server 127.0.0.1:8443;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rc.yourdomain.com;   # ← 改成你的域名

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    client_max_body_size 10m;

    location / {
        proxy_pass http://remote_control_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name rc.yourdomain.com;
    return 301 https://$host$request_uri;
}
